databases:
  - name: searchintel-staging-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    databaseName: searchintel_staging
    user: searchintel_staging
    ipAllowList: []

services:
  - type: web
    name: searchintel-staging-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: >-
      python -m alembic upgrade head &&
      exec python -m uvicorn app.main:app
      --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.9
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: searchintel-staging-db
          property: connectionString
      - key: API_TOKEN
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: searchintel-staging-web
    runtime: node
    plan: free
    region: singapore
    rootDir: frontend
    buildCommand: npm ci && npm exec next -- build --webpack
    startCommand: npm run start -- -p $PORT
    healthCheckPath: /
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: SEARCHINTEL_API_BASE_URL
        sync: false
      - key: SEARCHINTEL_API_TOKEN
        fromService:
          type: web
          name: searchintel-staging-api
          envVarKey: API_TOKEN
