services:
  - type: web
    name: searchintel-staging-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: >-
      python -m alembic upgrade head &&
      exec python -m uvicorn app.main:app
      --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.9
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: API_TOKEN
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
