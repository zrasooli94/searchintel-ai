services:
  postgres:
    image: postgres:16
    container_name: searchintel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: searchintel
      POSTGRES_PASSWORD: searchintel
      POSTGRES_DB: searchintel
    ports:
      - "5432:5432"
    volumes:
      - searchintel_postgres_data:/var/lib/postgresql/data

volumes:
  searchintel_postgres_data: